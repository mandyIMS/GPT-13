# Build TrollStore package on GitHub-hosted macOS runners (experimental).
#
# Two modes, selected when the workflow is run by hand:
# - probe (default): validates the runner without building Gecko. Checks the
#   environment, installs tools, fetches and patches the Firefox source,
#   generates the Xcode project, and reports disk headroom. Finishes in
#   well under an hour. Run this first; only attempt `full` if it passes.
# - full: runs the whole build (Gecko + app + TrollStore package). NOTE: the
#   full build additionally requires the pinned Mozilla Clang 21 / Node 22
#   toolchains, and nothing in this repository downloads them yet, so
#   `full` is expected to stop at the toolchain check in
#   tools/development/build-gecko.sh until a bootstrap step is added.
#
# CI adaptation: the scripts in tools/ normally refuse to run unless the
# repository lives on an external volume under /Volumes/ with a preinstalled
# toolchain cache. Setting REYNARD_ALLOW_INTERNAL_STORAGE=1 (done below)
# opts in to building on the runner's internal storage. The guards in
# tools/ are unchanged by default; only this opt-in skips them. Disk space,
# the 6-hour job limit, and runner RAM remain the main risks for `full`.
#
# Trigger is manual-only (workflow_dispatch). Do not add `push` triggering
# until the first full build succeeds.

name: Build TrollStore package (draft)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: probe validates the runner, full builds everything"
        type: choice
        options:
          - probe
          - full
        default: probe

permissions:
  contents: read

jobs:
  build-tipa:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      REYNARD_CACHE_ROOT: ${{ github.workspace }}/.cache/reynard
      REYNARD_ALLOW_INTERNAL_STORAGE: "1"
      REYNARD_BUILD_JOBS: "2"
      REYNARD_CARGO_JOBS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history: the build script counts commits for the build number.
          fetch-depth: 0
          # Do not fetch submodules here. tools/development/update-gecko.sh
          # fetches the pinned Firefox tag at depth 1 instead.
          submodules: false

      - name: Show environment
        run: |
          set -euo pipefail
          uname -a
          uname -m
          sysctl hw.memsize hw.ncpu hw.model || true
          pwd
          df -h
          sudo -n true && echo "passwordless sudo: yes" || echo "passwordless sudo: no"
          ls /Applications/ | grep -i xcode || true
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-path || true
          xcrun --sdk macosx --show-sdk-path || true
          MACOS_SDK="$(xcrun --sdk macosx --show-sdk-path || true)"
          if [ -n "$MACOS_SDK" ] && [ -f "$MACOS_SDK/usr/include/xpc/xpc.h" ]; then echo "XPC headers: present"; else echo "XPC headers: MISSING"; fi
          rustc --version || true
          cargo --version || true
          rustup target list --installed || true
          python3 --version || true
          git --version || true
          command -v xcodegen || true
          command -v ldid || true

      - name: Run navigation-policy tests (no Gecko needed)
        run: |
          set -euo pipefail
          mkdir -p /tmp/muse-policy-tests
          xcrun swiftc \
            browser/ReynardGPT/Core/GPTNavigationPolicy.swift \
            browser/ReynardGPT/Core/GPTUserAgentPolicy.swift \
            tests/ReynardGPTNavigationPolicyTests.swift \
            -o /tmp/muse-policy-tests/ReynardGPTNavigationPolicyTests
          /tmp/muse-policy-tests/ReynardGPTNavigationPolicyTests

      - name: Preflight (CI mode)
        run: |
          set -euo pipefail
          echo "CI mode: REYNARD_ALLOW_INTERNAL_STORAGE=$REYNARD_ALLOW_INTERNAL_STORAGE"
          if [ "${REYNARD_ALLOW_INTERNAL_STORAGE:-0}" != "1" ]; then
            echo "::error::CI bypass is not enabled. This workflow requires REYNARD_ALLOW_INTERNAL_STORAGE=1."
            exit 1
          fi
          echo "Cache root: $REYNARD_CACHE_ROOT"
          df -h
          echo "Preflight passed (disk headroom is evaluated from probe output; no threshold is enforced yet)."

      - name: Install build tools
        run: |
          set -euo pipefail
          # TODO: verify ldid availability on the chosen runner image.
          brew install xcodegen ldid || brew install xcodegen
          command -v xcodegen
          command -v ldid
          xcodegen --version || true
          time rustup target add aarch64-apple-ios

      - name: Fetch and patch Gecko
        run: |
          set -euo pipefail
          df -h
          time tools/development/update-gecko.sh
          du -sh engine/firefox || true
          df -h
          time tools/development/apply-patches.sh
          df -h

      - name: Probe report (no Gecko build)
        if: ${{ inputs.mode == 'probe' }}
        run: |
          set -euo pipefail
          echo "=== Xcode project generation check ==="
          xcodegen --spec browser/project-reynardgpt.yml --project browser --project-root browser
          xcodebuild -project browser/ReynardGPT.xcodeproj -scheme ReynardGPT -list || true
          echo "=== Toolchain paths (expected under cache root) ==="
          echo "REYNARD_CACHE_ROOT=$REYNARD_CACHE_ROOT"
          ls -la "$REYNARD_CACHE_ROOT/toolchains" || echo "No toolchains directory yet (expected before bootstrap)."
          echo "=== Disk projection ==="
          df -h
          du -sh engine/firefox "$REYNARD_CACHE_ROOT" 2>/dev/null || true
          echo "Probe complete. Review the output above before running mode=full."

      - name: Build Gecko
        if: ${{ inputs.mode == 'full' }}
        timeout-minutes: 330
        run: |
          set -euo pipefail
          df -h
          tools/development/build-gecko.sh
          df -h

      - name: Build app and TrollStore package
        if: ${{ inputs.mode == 'full' }}
        run: |
          set -euo pipefail
          tools/release/build-reynardgpt.sh
          tools/release/create-reynardgpt-tipa.sh
          tools/release/verify-reynardgpt-tipa.sh
          ls -lh dist/

      - name: Upload TrollStore package
        if: ${{ inputs.mode == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: Muse-TrollStore-tipa
          path: dist/*.tipa
          if-no-files-found: error
