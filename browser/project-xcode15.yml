name: Reynard-Xcode15

options:
  xcodeVersion: "15.2"
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    ARCHS: arm64
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    ENABLE_BITCODE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GCC_C_LANGUAGE_STANDARD: gnu17
    IPHONEOS_DEPLOYMENT_TARGET: "13.0"
    SDKROOT: iphoneos
    SUPPORTED_PLATFORMS: iphoneos
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  GeckoView:
    type: framework
    platform: iOS
    deploymentTarget: "13.0"
    configFiles:
      Debug: Configuration/Reynard.xcconfig
      Release: Configuration/Reynard.xcconfig
    sources:
      - path: GeckoView
        excludes:
          - Info.plist
      - path: Helper/ExtensionBridge.h
      - path: Helper/ExtensionBridge.mm
      - path: Reynard/Shared/Utils.m
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_STYLE: Manual
        CURRENT_PROJECT_VERSION: 1
        DEFINES_MODULE: YES
        DYLIB_COMPATIBILITY_VERSION: 1
        DYLIB_CURRENT_VERSION: 1
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        INSTALL_PATH: $(LOCAL_LIBRARY_DIR)/Frameworks
        INFOPLIST_FILE: GeckoView/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/Frameworks/GeckoView.framework"
          - "@loader_path/Frameworks"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.minh-ton.GeckoView
        PRODUCT_NAME: $(TARGET_NAME:c99extidentifier)
        SKIP_INSTALL: YES
        SWIFT_INSTALL_OBJC_HEADER: YES
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Reynard/Bridging/Reynard-Bridging-Header.h
        SWIFT_OBJC_INTERFACE_HEADER_NAME: $(PRODUCT_MODULE_NAME)-Swift.h

  Reynard Helper:
    type: app-extension
    platform: iOS
    deploymentTarget: "13.0"
    configFiles:
      Debug: Configuration/Reynard.xcconfig
      Release: Configuration/Reynard.xcconfig
    sources:
      - path: Helper/Helper.swift
      - path: Helper/main.m
    dependencies:
      - target: GeckoView
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: $(SRCROOT)/Helper/Entitlements/Reynard-Helper.entitlements
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_STYLE: Manual
        CURRENT_PROJECT_VERSION: $(CURRENT_BUILD)
        INFOPLIST_KEY_CFBundleDisplayName: Reynard Helper
        INFOPLIST_FILE: Helper/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
          - "@executable_path/../../Frameworks/GeckoView.framework"
          - "@loader_path/../../Frameworks/GeckoView.framework"
        MARKETING_VERSION: $(CURRENT_VERSION)
        OTHER_LDFLAGS:
          - $(inherited)
          - $(GECKO_DIST)/bin/XUL
          - -lmozglue
          - -lnss3
          - -lfreebl3
          - -lsoftokn3
          - -llgpllibs
          - -lmozavcodec
          - -lmozavutil
          - -lgkcodecs
          - -lmozinference
          - -Wl,-u,_NSExtensionMain
        PRODUCT_BUNDLE_IDENTIFIER: com.minh-ton.Reynard.Helper
        PRODUCT_NAME: $(TARGET_NAME)
        SKIP_INSTALL: YES
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Reynard/Bridging/Reynard-Bridging-Header.h

  OpenIn:
    type: app-extension
    platform: iOS
    deploymentTarget: "13.0"
    sources:
      - path: Extensions/OpenIn
        excludes:
          - Info.plist
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_STYLE: Manual
        CURRENT_PROJECT_VERSION: $(CURRENT_BUILD)
        INFOPLIST_KEY_CFBundleDisplayName: Open in Reynard
        INFOPLIST_FILE: Extensions/OpenIn/Info.plist
        MARKETING_VERSION: $(CURRENT_VERSION)
        PRODUCT_BUNDLE_IDENTIFIER: com.minh-ton.Reynard.OpenIn
        PRODUCT_NAME: $(TARGET_NAME)
        SKIP_INSTALL: YES
        SWIFT_OBJC_BRIDGING_HEADER: ""

  Reynard:
    type: application
    platform: iOS
    deploymentTarget: "13.0"
    configFiles:
      Debug: Configuration/Reynard.xcconfig
      Release: Configuration/Reynard.xcconfig
    sources:
      - path: Reynard
        excludes:
          - JIT/Unsandboxed/ptrace_jit.c
          - Resources/Info.plist
    dependencies:
      - target: GeckoView
        embed: true
      - target: Reynard Helper
        embed: true
      - target: OpenIn
        embed: true
    postBuildScripts:
      - name: Copy Gecko Stuff
        script: sh "${SRCROOT}/Scripts/AddGecko.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: $(SRCROOT)/Reynard/Entitlements/Reynard.entitlements
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_STYLE: Manual
        CURRENT_PROJECT_VERSION: $(CURRENT_BUILD)
        INFOPLIST_KEY_CFBundleDisplayName: Reynard
        INFOPLIST_FILE: Reynard/Resources/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Camera access lets websites in this browser scan QR codes, capture photos, and start video calls.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Location access lets websites in this browser provide location-based content such as maps, directions, and nearby places.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Microphone access lets websites in this browser capture your voice for calls and audio recordings.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Photo library access lets this browser save images and other media you download from websites to Photos.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Photo library access lets this browser upload photos and videos from your library and save images and other media you download from websites to Photos.
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/Frameworks/GeckoView.framework"
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Reynard/JIT
          - $(SRCROOT)/Reynard/JIT/RPPairing
        MARKETING_VERSION: $(CURRENT_VERSION)
        PRODUCT_BUNDLE_IDENTIFIER: com.minh-ton.Reynard
        PRODUCT_NAME: $(TARGET_NAME)
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Reynard/Bridging/Reynard-Bridging-Header.h

schemes:
  Reynard:
    build:
      targets:
        Reynard: all
    run:
      config: Debug
    archive:
      config: Release
