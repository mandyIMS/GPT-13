name: ReynardGPT

options:
  xcodeVersion: "15.2"
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    ARCHS: arm64
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    ENABLE_BITCODE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GCC_C_LANGUAGE_STANDARD: gnu17
    IPHONEOS_DEPLOYMENT_TARGET: "13.0"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  GeckoView:
    type: framework
    platform: iOS
    deploymentTarget: "13.0"
    configFiles:
      Debug: Configuration/Reynard.xcconfig
      Release: Configuration/Reynard.xcconfig
    sources:
      - path: GeckoView
        excludes:
          - Info.plist
      - path: Helper/ExtensionBridge.h
      - path: Helper/ExtensionBridge.mm
      - path: Reynard/Shared/Utils.h
      - path: Reynard/Shared/Utils.m
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_STYLE: Manual
        CURRENT_PROJECT_VERSION: 1
        DEFINES_MODULE: YES
        DYLIB_COMPATIBILITY_VERSION: 1
        DYLIB_CURRENT_VERSION: 1
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        INFOPLIST_FILE: GeckoView/Info.plist
        INSTALL_PATH: $(LOCAL_LIBRARY_DIR)/Frameworks
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/Frameworks/GeckoView.framework"
          - "@loader_path/Frameworks"
        MARKETING_VERSION: "1.0"
        OTHER_LDFLAGS: &gecko_libraries
          - $(inherited)
          - $(GECKO_DIST)/bin/XUL
          - -lmozglue
          - -lnss3
          - -lfreebl3
          - -lsoftokn3
          - -llgpllibs
          - -lmozavcodec
          - -lmozavutil
          - -lgkcodecs
          - -lmozinference
        PRODUCT_BUNDLE_IDENTIFIER: com.mandyims.muse13.geckoview
        PRODUCT_NAME: $(TARGET_NAME:c99extidentifier)
        SKIP_INSTALL: YES
        SWIFT_INSTALL_OBJC_HEADER: YES
        # Framework targets expose Objective-C through their module map; Xcode
        # explicitly rejects bridging headers on framework targets.
        SWIFT_OBJC_BRIDGING_HEADER: ""
        SWIFT_OBJC_INTERFACE_HEADER_NAME: $(PRODUCT_MODULE_NAME)-Swift.h

  Reynard Helper:
    type: app-extension
    platform: iOS
    deploymentTarget: "13.0"
    configFiles:
      Debug: Configuration/Reynard.xcconfig
      Release: Configuration/Reynard.xcconfig
    sources:
      - path: Helper/Helper.swift
      - path: Helper/main.m
    dependencies:
      - target: GeckoView
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_STYLE: Manual
        CURRENT_PROJECT_VERSION: $(CURRENT_BUILD)
        INFOPLIST_FILE: Helper/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
          - "@executable_path/../../Frameworks/GeckoView.framework"
          - "@loader_path/../../Frameworks/GeckoView.framework"
        MARKETING_VERSION: $(CURRENT_VERSION)
        OTHER_LDFLAGS:
          - $(inherited)
          - $(GECKO_DIST)/bin/XUL
          - -lmozglue
          - -lnss3
          - -lfreebl3
          - -lsoftokn3
          - -llgpllibs
          - -lmozavcodec
          - -lmozavutil
          - -lgkcodecs
          - -lmozinference
          - -Wl,-u,_NSExtensionMain
        PRODUCT_BUNDLE_IDENTIFIER: com.mandyims.muse13.helper
        PRODUCT_NAME: Reynard Helper
        SKIP_INSTALL: YES
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/ReynardGPT/Bridging/ReynardGPT-Bridging-Header.h

  ReynardGPT:
    type: application
    platform: iOS
    deploymentTarget: "13.0"
    configFiles:
      Debug: Configuration/Reynard.xcconfig
      Release: Configuration/Reynard.xcconfig
    sources:
      - path: ReynardGPT
        excludes:
          - Resources/Info.plist
          - Entitlements
      - path: ReynardGPT/Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: GeckoView
        embed: true
      - target: Reynard Helper
        embed: true
    postBuildScripts:
      - name: Copy Gecko Runtime
        script: sh "${SRCROOT}/Scripts/AddGecko.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: $(SRCROOT)/ReynardGPT/Entitlements/ReynardGPT.entitlements
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_STYLE: Manual
        CURRENT_PROJECT_VERSION: $(CURRENT_BUILD)
        INFOPLIST_FILE: ReynardGPT/Resources/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/Frameworks/GeckoView.framework"
        MARKETING_VERSION: $(CURRENT_VERSION)
        OTHER_LDFLAGS: *gecko_libraries
        PRODUCT_BUNDLE_IDENTIFIER: com.mandyims.muse13
        PRODUCT_NAME: ReynardGPT
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/ReynardGPT/Bridging/ReynardGPT-Bridging-Header.h

  ReynardGPTUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "13.0"
    sources:
      - path: ../tests/ReynardGPTUITests
    dependencies:
      - target: ReynardGPT
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mandyims.muse13.uitests
        PRODUCT_NAME: ReynardGPTUITests
        TEST_TARGET_NAME: ReynardGPT

schemes:
  ReynardGPT:
    build:
      targets:
        ReynardGPT: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ReynardGPTUITests
    archive:
      config: Release
